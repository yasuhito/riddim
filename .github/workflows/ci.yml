name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: test/support/package-lock.json
      - run: npm --prefix test/support ci --ignore-scripts
      - run: bundle exec rake
